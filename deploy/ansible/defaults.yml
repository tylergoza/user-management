# Defaults for every setting. Override any of them in vars.yml (gitignored;
# start from vars.example.yml), which is loaded after this file.

# DigitalOcean API token with read/write scope, from the environment so it
# never lands in a file.
do_token: "{{ lookup('env', 'DIGITALOCEAN_TOKEN') }}"

# Droplet. `doctl compute size list` / `region list` / `image list-distribution`
# show the choices. nyc3 is New York 3; s-1vcpu-1gb is the $6/month Basic
# droplet, which is plenty for this app.
# User Management shares the maintenance tracker's droplet: it finds it by
# the tracker's tag and adds itself alongside (port 8100, its own service
# user, data folder and Caddy site), like the production planner. The apps
# reach it on 127.0.0.1:8100 for their server-to-server calls.
droplet_name: maintenance-tracker
do_region: nyc3
do_size: s-1vcpu-1gb
do_image: ubuntu-26-04-x64
# Weekly droplet snapshots (adds 20% to the droplet price). The database is
# the only state, and the pre-deploy backups below sit on the same disk.
do_backups: true
do_monitoring: true
# Project (as named in the control panel) to put the droplet in. Empty means
# the account's default project.
do_project: ""
# Droplets, firewall and deploys all find each other by this tag.
do_tag: maintenance-tracker
# More tags for the droplet, e.g. ones your own cloud firewalls target.
# Added to existing droplets too on the next provision.
do_extra_tags: []
# Create a cloud firewall (named do_tag) that allows only SSH, HTTP and HTTPS.
# Turn off if your own firewalls cover the droplet through do_extra_tags.
do_firewall: true

# Key Ansible connects with. Empty means your normal ssh setup (agent,
# ~/.ssh/config). Set it to use a dedicated deploy key, e.g. when your usual
# key is on a hardware token that asks for a PIN, which Ansible can't answer.
ssh_private_key_file: ""
# Agent holding that key, if not the one ~/.ssh/config picks (e.g. it points
# at 1Password but the key was added with ssh-add). SSH_AUTH_SOCK means the
# agent in your environment; anything else is a socket path.
ssh_identity_agent: ""
# Uploaded to your DigitalOcean account if it isn't there yet, and put on the
# droplet for root when it's created.
ssh_public_key_file: "{{ (ssh_private_key_file ~ '.pub') if ssh_private_key_file else '~/.ssh/id_ed25519.pub' }}"
# More public key files to let in as root, e.g. your hardware-token keys when
# Ansible uses a deploy key. Added on every provision; never removed.
ssh_authorized_keys: []
# Who may reach port 22. Narrow this to your own address if it's stable.
ssh_sources: [0.0.0.0/0, "::/0"]

# Public address: accounts.<dns_zone> unless vars.yml says otherwise.
app_domain: "accounts.{{ dns_zone }}"

# Church time zone, for times shown on pages.
tz: America/Chicago

# Leave admin_username empty when moving people over from the tracker and
# planner (the usual case): import-users.yml then makes your existing admin
# the user admin here, keeping their current password. Until then the first
# deploy leaves the app stopped, so /setup is never open to the internet.
# An "admin" created here first would block that: import-users leaves people
# who are already here alone, password included.
# Set it for a fresh start with no import: the first deploy creates this user
# admin before the app starts. Leave UM_ADMIN_PASSWORD unset to get a random
# password printed at the end of the run.
admin_username: ""
admin_password: "{{ lookup('env', 'UM_ADMIN_PASSWORD') }}"

# Deploys back up the database before installing a changed binary, and keep
# this many of those backups.
keep_backups: 10
# `make test` runs before every build; -e skip_tests=true skips it.
skip_tests: false

# Paths on the droplet, matching deploy/user-management.service.
app_user: accounts
app_bin: /usr/local/bin/user-management
app_data_dir: /var/lib/user-management
app_db: "{{ app_data_dir }}/users.db"
app_backup_dir: "{{ app_data_dir }}/backups"

# The sibling apps on the same droplet, for backup.yml and import-users.yml.
# These match their deploy/*.service files.
tracker_user: maintenance
tracker_bin: /usr/local/bin/maintenance-tracker
tracker_db: /var/lib/maintenance-tracker/maintenance.db
tracker_backup_dir: /var/lib/maintenance-tracker/backups
planner_user: planner
planner_bin: /usr/local/bin/production-planner
planner_db: /var/lib/production-planner/productions.db
planner_backup_dir: /var/lib/production-planner/backups
events_user: events
events_bin: /usr/local/bin/event-planner
events_db: /var/lib/event-planner/events.db
events_backup_dir: /var/lib/event-planner/backups
calendar_user: calendar
calendar_bin: /usr/local/bin/church-calendar
calendar_db: /var/lib/church-calendar/calendar.db
calendar_backup_dir: /var/lib/church-calendar/backups

# import-users.yml: the apps' public https addresses. They're registered here
# with redirect URI <url>/auth/callback. Only needed while an app isn't
# registered yet.
tracker_url: ""
planner_url: ""
# register-app.yml: the event planner's public https address (registered as
# client "events", redirect URI <events_url>/auth/callback).
events_url: ""
# register-app.yml: the church calendar's public https address (client
# "calendar").
calendar_url: ""
# register-app.yml: the apps it can register or rotate (-e app=<key>, or
# make register-app APP=<key>). The key is the client ID. name must match
# what import-users registered, or a re-run looks like a rename. keychain is
# the login Keychain service the secret is saved to, env the variable `with-um`
# exports from it, deploy_repo the sibling repo to redeploy afterwards, and
# copy_access_from the app whose people get the same access (optional;
# -e copy_access_from= copies nobody, -e copy_access_from=<key> overrides).
# roles       the app's roles, comma separated (optional; passed as --roles, so
#             an app that's already registered gets this list; unset leaves
#             its roles alone)
# rename_roles  list like ["user=helper"] (optional; --rename-role: everyone
#             with the old role gets the new one)
# Adding an app = one entry here + one line in your `with-um` in ~/.zshrc.
sso_apps:
  calendar:
    name: Church Calendar
    url: "{{ calendar_url }}"
    keychain: um-calendar
    env: UM_CALENDAR_SECRET
    deploy_repo: calendar
    copy_access_from: events
    roles: member,scheduler,admin
  events:
    name: Event Planner
    url: "{{ events_url }}"
    keychain: um-events
    env: UM_EVENTS_SECRET
    deploy_repo: event_planning
    copy_access_from: planner
    roles: helper,planner,admin
    rename_roles: ["user=helper"]
  planner:
    name: Production Planner
    url: "{{ planner_url }}"
    keychain: um-planner
    env: UM_PLANNER_SECRET
    deploy_repo: production_planning
  tracker:
    name: Maintenance Tracker
    url: "{{ tracker_url }}"
    keychain: um-tracker
    env: UM_TRACKER_SECRET
    deploy_repo: maintenance_tracking
# register-app.yml: true makes a new secret for an app that's already
# registered (the old one stops working at once; redeploy the app with the
# new one). A new app gets a secret either way.
rotate_secret: false
# register-app.yml: when it makes a secret and this machine is a Mac, it is
# saved to the login Keychain under the app's sso_apps keychain name instead
# of printing it. Not set here on purpose: -e keychain_service=<name>
# overrides the name, -e keychain_service= prints the secret instead.
# Whose password wins when someone's differ between the apps: "" (the one
# used most recently), tracker or planner.
prefer: ""
# import-users.yml and register-app.yml only show what it would do unless run with -e dry_run=false.
dry_run: true

do_headers:
  Authorization: "Bearer {{ do_token }}"
  Content-Type: application/json
