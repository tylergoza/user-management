# Tests and builds the Linux binary on this machine, installs it and the systemd
# unit on every droplet tagged do_tag, then writes this app's Caddy site on the
# edge box(es). The database is backed up first whenever the binary changes
# (migrations run on start).
#
#   with-do-church make deploy              # or ansible-playbook deploy.yml here
#
# While there are no users yet and admin_username is empty, the app is
# installed but left stopped, so /setup is never open: import-users.yml
# starts it after a real import.
#
# With -e restore_pending=true the binary and unit go in but the app isn't
# started and no admin is made, so `make restore` finds no database.
#
# To roll back, check out the previous commit and deploy it. If its
# migrations changed the database, restore the pre-deploy backup as well
# (README: Moving between hosts).

- name: Build
  hosts: localhost
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    - name: Check the account
      ansible.builtin.include_tasks: tasks/check_account.yml

    - name: Find the droplets
      ansible.builtin.include_tasks: tasks/find_droplets.yml

    - name: Check there's somewhere to deploy to
      ansible.builtin.assert:
        that: groups['app'] | default([]) | length > 0
        fail_msg: No droplets are tagged {{ do_tag }}. Run provision.yml first.
        quiet: true

    - name: Check there's an edge box to route through
      ansible.builtin.assert:
        that: groups['edge'] | default([]) | length > 0
        fail_msg: >-
          No droplet is tagged {{ edge_tag }}, so nothing would serve {{ app_domain }}.
          Provision the edge box first (edge_proxy: make provision).
        quiet: true

    - name: Check the app box has a VPC address
      ansible.builtin.assert:
        that: hostvars[groups['app'][0]].private_ip | length > 0
        fail_msg: "{{ groups['app'][0] }} has no private (VPC) address, which the app binds to."
        quiet: true

    - name: Run the tests
      ansible.builtin.command:
        cmd: make test
        chdir: "{{ repo_root }}"
      when: not skip_tests | bool
      changed_when: false

    - name: Build the binary
      ansible.builtin.command:
        cmd: make build-linux
        chdir: "{{ repo_root }}"
      changed_when: true

- name: Install
  hosts: app
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    binary: "{{ playbook_dir | dirname | dirname }}/bin/user-management-linux-amd64"
    # Commands run as the service user so the files they write stay its own.
    # runuser rather than become: Ubuntu 26.04's default sudo is sudo-rs.
    um: [runuser, -u, "{{ app_user }}", --, "{{ app_bin }}", -db, "{{ app_db }}"]
  handlers:
    - name: Restart the app
      ansible.builtin.systemd_service:
        name: user-management
        state: restarted
        daemon_reload: true
      when: not hold_start
  tasks:
    - name: Checksum the new binary
      ansible.builtin.stat:
        path: "{{ binary }}"
      delegate_to: localhost
      register: new_binary

    - name: Checksum the installed binary
      ansible.builtin.stat:
        path: "{{ app_bin }}"
      register: old_binary

    - name: Check for a database
      ansible.builtin.stat:
        path: "{{ app_db }}"
      register: db

    - name: Count the users
      ansible.builtin.command:
        argv: [runuser, -u, "{{ app_user }}", --, sqlite3, -readonly, "{{ app_db }}", SELECT count(*) FROM users]
      register: user_count
      when: db.stat.exists
      changed_when: false

    # No users yet means /setup would be open to whoever gets there first.
    - name: Decide whether the app may start
      ansible.builtin.set_fact:
        no_users: "{{ not db.stat.exists or user_count.stdout | trim == '0' }}"
        hold_start: "{{ restore_pending | bool or ((not db.stat.exists or user_count.stdout | trim == '0') and admin_username | length == 0) }}"

    - name: Back up the database
      ansible.builtin.command:
        argv: "{{ um + ['backup', app_backup_dir ~ '/pre-deploy-' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ') ~ '.db'] }}"
      when: db.stat.exists and old_binary.stat.checksum | default('') != new_binary.stat.checksum
      changed_when: true

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ binary }}"
        dest: "{{ app_bin }}"
        mode: "0755"
      notify: Restart the app

    - name: Install the systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../user-management.service"
        dest: /etc/systemd/system/user-management.service
        mode: "0644"
      notify: Restart the app

    - name: Create the unit's drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/system/user-management.service.d
        state: directory
        mode: "0755"

    # The unit in the repo has a placeholder TZ and listens on loopback; this
    # overrides both (ADDR is the box's VPC address, where the edge box's Caddy
    # reaches it).
    - name: Set the time zone and the address
      ansible.builtin.copy:
        content: |
          [Service]
          Environment=ADDR={{ private_ip }}:{{ app_port }}
          Environment=TZ={{ tz }}
        dest: /etc/systemd/system/user-management.service.d/override.conf
        mode: "0644"
      notify: Restart the app

    # Before the app first starts, so /setup is never reachable.
    - name: Create the user admin
      when: no_users and admin_username | length > 0 and not restore_pending | bool
      vars:
        password: "{{ admin_password or lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      block:
        - name: Pick the admin password
          ansible.builtin.set_fact:
            new_admin_password: "{{ password }}"
          no_log: true

        - name: Create {{ admin_username }}
          ansible.builtin.command:
            argv: "{{ um + ['create-user', admin_username, '--admin'] }}"
            stdin: "{{ new_admin_password }}"
          no_log: true
          changed_when: true

    - name: Start the app
      ansible.builtin.systemd_service:
        name: user-management
        enabled: true
        state: started
        daemon_reload: true
      when: not hold_start

    # The restore starts it, once the database is in place.
    - name: Let systemd see the new unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: restore_pending | bool

    # Not enabled either, so a reboot doesn't start it with /setup open.
    - name: Leave the app stopped until the import
      ansible.builtin.systemd_service:
        name: user-management
        enabled: false
        state: stopped
        daemon_reload: true
      when: hold_start and not restore_pending | bool

    - name: Apply restarts and reloads
      ansible.builtin.meta: flush_handlers

    - name: Wait for the app to answer
      ansible.builtin.uri:
        url: http://{{ private_ip }}:{{ app_port }}/healthz
      register: health
      until: health.status == 200
      retries: 15
      delay: 2
      when: not hold_start

    - name: Find old pre-deploy backups
      ansible.builtin.find:
        paths: "{{ app_backup_dir }}"
        patterns: pre-deploy-*.db
      register: backups

    - name: Remove all but the newest {{ keep_backups }}
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (backups.files | sort(attribute='mtime', reverse=true))[keep_backups | int :] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Done
      vars:
        pending: "Installed, not started: run make restore next."
        held: >-
          Installed but not started: there are no users yet, and starting now
          would leave /setup open. Run `make import-users` (a dry run first, then
          `make import-users DRY_RUN=false`), which starts it at https://{{ app_domain }}.
      ansible.builtin.debug:
        msg: >-
          {{ pending if restore_pending | bool
          else held if hold_start
          else ('Running at https://' ~ app_domain ~ '. Sign in as ' ~ admin_username ~ ' with password ' ~ new_admin_password ~ ' and change it.')
          if new_admin_password is defined
          else 'Deployed to https://' ~ app_domain ~ '.' }}

# Each app owns its route: the edge box(es) get this app's site file, then
# Caddy reloads. With two edge boxes both are written.
- name: Route the domain through the edge box
  hosts: edge
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  tasks:
    - name: Create the Caddy sites folder
      ansible.builtin.file:
        path: /etc/caddy/sites
        state: directory
        mode: "0755"

    - name: Install this app's Caddy site
      ansible.builtin.template:
        src: site.caddy.j2
        dest: /etc/caddy/sites/user-management.caddy
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s

    - name: Reload Caddy
      ansible.builtin.include_tasks: tasks/caddy_reload.yml
