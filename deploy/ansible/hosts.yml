# Only localhost lives here. Droplets are looked up by tag through the
# DigitalOcean API on every run (tasks/find_droplets.yml) and added to "app" and
# "edge"; the box a backup comes from is added to "source" (tasks/find_source.yml).
# No addresses are committed.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    app:
    edge:
    source:
