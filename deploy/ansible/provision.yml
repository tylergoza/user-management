# Creates the apps box if it doesn't exist (or finds it, when another app made
# it), its alerts and this app's DNS record, prepares the machine (updates, swap,
# service user), then runs deploy.yml. The firewalls and the edge box come from
# edge_proxy. Safe to re-run: existing things are found by tag/name and left in
# place.
#
#   with-do-church make provision                         # or ansible-playbook provision.yml here
#   with-do-church make provision RESTORE_PENDING=true    # then make restore

- name: Create the droplet, alerts and DNS record
  hosts: localhost
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    # Created with these, and any that are missing are added to an existing box.
    box_tags: "{{ ([apps_box, do_role_tag] + do_extra_tags) | unique }}"
  tasks:
    - name: Check the account
      ansible.builtin.include_tasks: tasks/check_account.yml

    - name: Find existing droplets
      ansible.builtin.include_tasks: tasks/find_droplets.yml

    - name: Check there's an edge box
      ansible.builtin.assert:
        that: groups['edge'] | default([]) | length > 0
        fail_msg: >-
          No droplet is tagged {{ edge_tag }}, so nothing would route to this app.
          Provision the edge box first (edge_proxy: make provision).
        quiet: true

    # Fixed here because a block's `when` is re-checked for every task in it,
    # and the lookup at the end of the block changes `tagged`.
    - name: Decide whether to create a droplet
      ansible.builtin.set_fact:
        create_droplet: "{{ tagged.json.droplets | selectattr('name', 'eq', droplet_name) | list | length == 0 }}"

    - name: Create the droplet
      when: create_droplet
      block:
        - name: Look for an untagged droplet with the same name
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/droplets?name={{ droplet_name }}
            headers: "{{ do_headers }}"
          register: same_name

        - name: Don't create a second one
          ansible.builtin.assert:
            that: same_name.json.droplets | length == 0
            fail_msg: >-
              A droplet named {{ droplet_name }} exists but isn't tagged {{ do_tag }}, which is
              how these plays find it. Add the tag back in the control panel, or delete the droplet.
            quiet: true

        - name: List SSH keys on the account
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/account/keys?per_page=200
            headers: "{{ do_headers }}"
          register: account_keys

        - name: Find the local public key on the account
          vars:
            # Type and key only; the trailing comment may differ.
            local_key: "{{ (lookup('ansible.builtin.file', ssh_public_key_file | expanduser).split()[:2]) | join(' ') }}"
          ansible.builtin.set_fact:
            local_key: "{{ local_key }}"
            key_ids: "{{ account_keys.json.ssh_keys | selectattr('public_key', 'match', local_key | regex_escape) | map(attribute='id') | list }}"

        - name: Upload the public key
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/account/keys
            method: POST
            headers: "{{ do_headers }}"
            body_format: json
            body:
              name: mountainview deploy key
              public_key: "{{ local_key }}"
            status_code: 201
          register: uploaded_key
          when: key_ids | length == 0

        - name: Create {{ droplet_name }}
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/droplets
            method: POST
            headers: "{{ do_headers }}"
            body_format: json
            body:
              name: "{{ droplet_name }}"
              region: "{{ do_region }}"
              size: "{{ do_size }}"
              image: "{{ do_image }}"
              ssh_keys: "{{ [uploaded_key.json.ssh_key.id] if uploaded_key is not skipped else key_ids }}"
              backups: "{{ do_backups }}"
              monitoring: "{{ do_monitoring }}"
              tags: "{{ box_tags }}"
            status_code: 202
          register: created
          changed_when: true

        - name: Wait for it to be running
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/droplets/{{ created.json.droplet.id }}
            headers: "{{ do_headers }}"
          register: droplet
          until: >-
            droplet.json.droplet.status == 'active'
            and droplet.json.droplet.networks.v4 | selectattr('type', 'eq', 'public') | list | length > 0
            and droplet.json.droplet.networks.v4 | selectattr('type', 'eq', 'private') | list | length > 0
          retries: 60
          delay: 5

        - name: Pick up the new droplet
          ansible.builtin.include_tasks: tasks/find_droplets.yml

    # Droplets can't be created in a project, only moved into one afterwards.
    - name: Put the droplets in the project
      when: do_project | length > 0
      block:
        - name: List projects
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/projects?per_page=200
            headers: "{{ do_headers }}"
          register: projects

        - name: Find project {{ do_project }}
          ansible.builtin.set_fact:
            project: "{{ projects.json.projects | selectattr('name', 'eq', do_project) | first | default({}) }}"

        - name: Check the project exists
          ansible.builtin.assert:
            that: project.id is defined
            fail_msg: >-
              No project named "{{ do_project }}". Projects on this account:
              {{ projects.json.projects | map(attribute='name') | join(', ') }}
            quiet: true

        - name: List what's in it
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/projects/{{ project.id }}/resources?per_page=200
            headers: "{{ do_headers }}"
          register: project_resources

        - name: Move the droplets in
          vars:
            urns: "{{ tagged.json.droplets | map(attribute='id') | map('regex_replace', '^', 'do:droplet:') | list }}"
            missing: "{{ urns | difference(project_resources.json.resources | map(attribute='urn')) }}"
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/projects/{{ project.id }}/resources
            method: POST
            headers: "{{ do_headers }}"
            body_format: json
            body: { resources: "{{ missing }}" }
          when: missing | length > 0
          changed_when: true

    # Also covers a box another app created, and ones made before a tag was added.
    - name: Add missing tags
      block:
        - name: List tags
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/tags?per_page=200
            headers: "{{ do_headers }}"
          register: account_tags

        - name: Create missing tags
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/tags
            method: POST
            headers: "{{ do_headers }}"
            body_format: json
            body: { name: "{{ item }}" }
            status_code: 201
          loop: "{{ box_tags | difference(account_tags.json.tags | map(attribute='name')) }}"

        - name: Tag the droplets
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/tags/{{ item.1 }}/resources
            method: POST
            headers: "{{ do_headers }}"
            body_format: json
            body: { resources: [{ resource_id: "{{ item.0.id | string }}", resource_type: droplet }] }
            status_code: 204
          loop: "{{ tagged.json.droplets | product(box_tags) | list }}"
          loop_control:
            label: "{{ item.0.name }}: {{ item.1 }}"
          when: item.1 not in item.0.tags
          changed_when: true

    - name: Monitoring alerts
      ansible.builtin.include_tasks: tasks/alerts.yml

    # Only edge boxes' addresses go in DNS, never the apps box's. A record that
    # already points at any edge box is left alone; moving records between edge
    # boxes is edge_proxy's move-edge.
    - name: Point the DNS record at the edge box
      when: manage_dns | bool
      vars:
        edge_ips: "{{ groups['edge'] | map('extract', hostvars, 'ansible_host') | list }}"
        existing: "{{ records.json.domain_records | default([]) }}"
        # "@" for the zone itself, otherwise the part before the zone.
        record_name: "{{ '@' if app_domain == dns_zone else app_domain | regex_replace('\\.' ~ (dns_zone | regex_escape) ~ '$', '') }}"
      block:
        - name: Look up the DNS record
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/domains/{{ dns_zone }}/records?type=A&name={{ app_domain }}
            headers: "{{ do_headers }}"
            status_code: [200, 404]
          register: records

        - name: Check the domain is on DigitalOcean
          ansible.builtin.assert:
            that: records.status == 200
            fail_msg: >-
              {{ dns_zone }} isn't a domain on this DigitalOcean account. Add it under
              Networking → Domains and point your registrar at ns1/ns2/ns3.digitalocean.com.
            quiet: true

        - name: Check {{ app_domain }} has at most one A record
          ansible.builtin.assert:
            that: existing | length <= 1
            fail_msg: "{{ app_domain }} has several A records. Sort that out by hand first."
            quiet: true

        - name: Check there's a single edge box to point at
          ansible.builtin.assert:
            that: existing | selectattr('data', 'in', edge_ips) | list | length == 1 or edge_ips | length == 1
            fail_msg: >-
              {{ app_domain }} is {{ 'missing' if not existing else 'not an edge box address (' ~ existing[0].data ~ ')' }}
              and there are {{ edge_ips | length }} edge boxes ({{ edge_ips | join(', ') }}), so it's unclear
              which to use. Point the record at one by hand, or use edge_proxy's repoint.
            quiet: true

        - name: Point the DNS record at the edge box
          ansible.builtin.uri:
            url: https://api.digitalocean.com/v2/domains/{{ dns_zone }}/records{{ ('/' ~ existing[0].id) if existing else '' }}
            method: "{{ 'PUT' if existing else 'POST' }}"
            headers: "{{ do_headers }}"
            body_format: json
            body: { type: A, name: "{{ record_name }}", data: "{{ edge_ips[0] }}", ttl: 300 }
            status_code: [200, 201]
          when: not existing or existing[0].data not in edge_ips
          changed_when: true

- name: Prepare the droplet
  hosts: app
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # First boot runs cloud-init, which holds the apt lock for a while.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    - name: Let in the other SSH keys
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        # Type and key only; the trailing comment may differ.
        regexp: "^{{ (lookup('ansible.builtin.file', item | expanduser).split()[:2]) | join(' ') | regex_escape }}( |$)"
        line: "{{ lookup('ansible.builtin.file', item | expanduser) | trim }}"
        create: true
        mode: "0600"
      loop: "{{ ssh_authorized_keys }}"

    # A broken third-party repo (e.g. Caddy's Cloudsmith one returning 402)
    # fails the index refresh. Then skip updates with a warning rather than
    # stopping the whole run; anything else still fails.
    - name: Install updates
      block:
        - name: Install updates
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist
      rescue:
        - name: Stop unless it was the index refresh that failed
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: "'update apt cache' not in ansible_failed_result.msg"

        - name: Warn that updates were skipped
          ansible.builtin.debug:
            msg: >-
              Updates skipped: apt couldn't refresh its index
              ({{ ansible_failed_result.msg }}). Carrying on; run provision
              again once the repo is back.

    - name: Install packages
      ansible.builtin.apt:
        name: [unattended-upgrades, python3-debian, sqlite3]

    - name: Check whether a reboot is needed
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot
      ansible.builtin.reboot:
      when: reboot_required.stat.exists

    - name: Create the swap file
      ansible.builtin.command: fallocate -l {{ swap_size }} /swapfile
      args:
        creates: /swapfile
      register: swap_file

    - name: Lock down the swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format the swap file
      ansible.builtin.command: mkswap /swapfile
      when: swap_file is changed

    - name: Mount swap at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    - name: Check whether swap is on
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_on
      changed_when: false

    - name: Turn swap on
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in swap_on.stdout"

    - name: Create the service user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        home: "{{ app_data_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create the data and backup folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      loop: ["{{ app_data_dir }}", "{{ app_backup_dir }}"]

- name: Deploy the app
  ansible.builtin.import_playbook: deploy.yml
