# Checks the whole config first: two files claiming one host only fail here.
- name: Validate the whole Caddy config
  ansible.builtin.command: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
  changed_when: false

- name: Reload Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded
