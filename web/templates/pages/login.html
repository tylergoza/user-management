{{define "content"}}
<div class="auth-card card">
  <h1>Sign in</h1>
  <p class="muted">One username and password for all of the church apps.</p>
  {{with .Error}}<div class="alert alert--error" role="alert">{{.}}</div>{{end}}
  <form method="post" action="/login" class="form">
    {{template "csrf" .CSRF}}
    <input type="hidden" name="next" value="{{.Next}}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--primary btn--block">Sign in</button>
  </form>
  <p class="muted small">Forgot your password? Ask a user admin to set a new one.</p>
</div>
{{end}}
